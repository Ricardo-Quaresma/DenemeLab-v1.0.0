name: "CodeQL Güvenlik Taraması"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '30 1 * * 0' # Her Pazar gecesi otomatik tarama

jobs:
  analyze:
    name: Güvenlik ve Kod Analizi
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'javascript-typescript' ]

    steps:
    - name: Depoyu Klonla
      uses: actions/checkout@v4

    - name: CodeQL Motorunu Başlat
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        queries: security-extended,security-and-quality

    - name: CodeQL Analizini Gerçekleştir
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{matrix.language}}"

